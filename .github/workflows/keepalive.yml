# Keeps the free Supabase project from pausing (it pauses after ~7 days without activity) and doubles
# as a health check: it asks the live API for slots, which goes through the Edge Function, the database
# and Google Calendar. If any of them breaks (e.g. the Google refresh token was revoked), this run fails
# and GitHub emails the repository owner.
name: Keep booking API awake

on:
  schedule:
    # 08:17 WIB on Monday, Wednesday and Friday (GitHub cron is UTC). Odd minute avoids the busy :00 slot.
    - cron: "17 1 * * 1,3,5"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Public values only (the same ones already shipped in app.js).
      API_URL: https://xjmvgrqtrunfpdkxqdst.supabase.co/functions/v1/booking-api
      PUBLISHABLE_KEY: sb_publishable_6TWSur18V_L3iVQdO8Q8GQ_p2tDBadA
    steps:
      - name: Ask the live API for slots
        run: |
          # Weekends return no slots without touching the database, so pick the first weekday >= 7 days ahead.
          for i in 7 8 9; do
            day=$(TZ=Asia/Jakarta date -d "+$i day" +%u)
            if [ "$day" -le 5 ]; then DATE=$(TZ=Asia/Jakarta date -d "+$i day" +%F); break; fi
          done
          echo "Checking slots for $DATE"
          for attempt in 1 2 3; do
            status=$(curl -s -o body.json -w "%{http_code}" --max-time 60 \
              -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H "Origin: https://aksitas.github.io" \
              "$API_URL/slots?date=$DATE&service=coaching")
            echo "Attempt $attempt: HTTP $status"; cat body.json; echo
            if [ "$status" = "200" ] && grep -q '"slots"' body.json; then exit 0; fi
            sleep 20
          done
          echo "::error::Booking API is not healthy. Check the Supabase project (paused?) and the Edge Function logs; a Google 'invalid_grant' means GOOGLE_REFRESH_TOKEN must be renewed."
          exit 1
